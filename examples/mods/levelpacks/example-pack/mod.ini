; An example level pack for Hopmon Native: three short new levels, a cave floor and its own
; crystal model. A level pack's textures, models, sounds and music are used only while the
; pack is played.
; Everything in this folder was made for Hopmon Native and may be copied freely (CC0).
[mod]
id = example-pack
name = Example Pack
author = Hopmon Native
version = 1.0.0
description = Three short levels, a cave floor and a new crystal.
requires = 1.3.0
api = 1
license = CC0 (public domain)

[pack]
name = Example Pack

; Worlds are played in this order. look = castle, forest or toy decides the props
; (poles, trees, short poles), the default floor and the default music.
[world.1]
name = Courtyard
look = castle
levels = first-steps

[world.2]
name = Arrow Garden
look = forest
music = Music03
levels = arrow-run

[world.3]
name = Crystal Cave
look = toy
floor = cave_floor
levels = cave

; fit = scale and move the model to fill the original model's space. Without it, the model's
; own units are used (the asset export's .glb files show the original sizes).
[models]
crystal = fit
